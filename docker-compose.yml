services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://alerting:alerting@postgres:5432/alerting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      # Must be reachable from the phone: ntfy action buttons call back to this URL.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-alerting@alerting.local}
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerting}
      POSTGRES_DB: ${POSTGRES_DB:-alerting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  demo-service:
    image: node:22-alpine
    command: node /srv/server.mjs
    environment:
      PORT: "4100"
    volumes:
      - ./fixtures/demo-service:/srv:ro
    expose:
      - "4100"

volumes:
  pgdata:
