services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgres://alerting:alerting@postgres:5432/alerting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
      # Must be reachable from the phone: ntfy action buttons call back to this URL.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Standalone ingest parse worker + rule engine in one container; scale with WORKERS=N.
  worker:
    build: .
    command:
      - sh
      - -c
      - |
        node packages/ingest/dist/main.js & p1=$$!
        node packages/engine/dist/main.js & p2=$$!
        trap 'kill $$p1 $$p2 2>/dev/null' TERM INT
        while kill -0 $$p1 2>/dev/null && kill -0 $$p2 2>/dev/null; do sleep 1; done
        kill $$p1 $$p2 2>/dev/null
        exit 1
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://alerting:alerting@postgres:5432/alerting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NTFY_URL: ${NTFY_URL:-http://ntfy:80}
    depends_on:
      app:
        condition: service_healthy
    deploy:
      replicas: ${WORKERS:-1}

  # Load generator (docker compose --profile loadtest run --rm loadtest ...)
  loadtest:
    image: node:20-alpine
    profiles: ["loadtest"]
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      BASE_URL: http://app:3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://alerting:alerting@postgres:5432/alerting
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerting}
      POSTGRES_DB: ${POSTGRES_DB:-alerting}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
