# Team Pricing's own runbook: the Appendix B free text ("restart the instance, wait, and if latency
# is still high, call the pricing on-call person") as automation. The shared text runbook
# "Pricing latency" also matches, so the alert page shows both.
# Steer it on the demo-service page (http://localhost:4100): Pricing latency → Still high.
id: rule-pricing-engine-warnings
ruleId: pricing-engine-warnings
matches: alert.ruleId = "pricing-engine-warnings"
name: Restart a slow pricing engine
type: automation
steps:
  # Restarting drops in-flight quotes, so a person decides.
  - id: restart
    name: "Restart {{labels.service}}"
    action: http
    method: POST
    url: "http://demo-service:4100/restart/{{labels.service}}"
    body: '{"reason":"{{alertname}}: {{annotations.summary}}"}'
    approval: required

  - name: Let the cache warm up
    action: wait
    duration: 10s

  - id: latency
    name: "Measure {{labels.service}} latency again"
    action: http
    method: GET
    url: "http://demo-service:4100/latency/{{labels.service}}"

  - name: Latency still high - call the pricing on-call
    if: steps.latency.body.high = true
    action: escalate
    group: pricing-team

  - name: Back to normal - tell #pricing
    if: steps.latency.body.high = false
    action: http
    method: POST
    url: http://demo-service:4100/chat/pricing
    headers:
      content-type: application/json
    body: '{"text":"{{labels.service}} restarted, latency back to normal"}'
