# Staging watch: everything raised in the staging environment goes to the UI of Pricing team (no pages).
id: staging-watch
name: Staging watch
enabled: true
when: 'alert.environment = staging'
who:
  - recipients:
      - { type: group, id: pricing-team }
    force: [ui]
looks:
  titleTemplate: '[staging] {{alert.title}}'
  fields: [alert.source, alert.severity]
createdAt: '2026-11-01T00:00:00Z'
updatedAt: '2026-11-01T00:00:00Z'
