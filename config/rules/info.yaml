# Info digest: low-urgency (info) alerts, such as rejected trades, go to Marek's UI only.
id: info-digest
name: Info digest
enabled: true
when: 'alert.severity = info'
who:
  - recipients:
      - { type: person, id: marek }
    force: [ui]
looks:
  titleTemplate: '{{alert.title}}'
  fields: [alert.source]
createdAt: '2026-11-01T00:00:00Z'
updatedAt: '2026-11-01T00:00:00Z'
